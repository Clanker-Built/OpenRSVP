<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="55%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="pivot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded square background, blue gradient -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- subtle reading sight-line, evokes the fixed-pivot RSVP guide -->
  <line x1="256" y1="76" x2="256" y2="120" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <line x1="256" y1="392" x2="256" y2="436" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- "OR" wordmark, with the pivot letter stroke in lighter accent blue -->
  <g filter="url(#shadow)" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="320" font-size="240" fill="url(#letters)" letter-spacing="-8">
      <tspan fill="url(#letters)">O</tspan><tspan fill="url(#pivot)">R</tspan>
    </text>
  </g>
</svg>
